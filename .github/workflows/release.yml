# Builds clone-bay.exe on GitHub's machines so a release can be traced to
# the commit it was built from. This is the project's only workflow; it does
# not run on ordinary pushes.
#
#   Push a tag "v<version>"  -> test, build, and open a DRAFT release holding
#                               the exe and SHA256SUMS.txt. Nothing is public
#                               until the draft is published by hand.
#   "Run workflow" button    -> the same test and build, kept as a workflow
#                               artifact. No tag and no release are made.
#
# Build provenance (a statement signed by GitHub saying which commit and
# workflow produced the exe) is added only while the repository is public:
# GitHub does not offer it for private repositories on a personal plan.
#
# Actions are pinned to a commit so they can't change under us. Update the
# hash and the version comment together.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs the project's code and its dependencies' build scripts, so it gets
  # read-only access and no signing rights.
  build:
    name: Test and build
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to check that a tagged commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust version
        shell: pwsh
        run: |
          # With no arguments this installs what rust-toolchain.toml names.
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Installing Rust failed' }
          rustc --version --verbose
          cargo --version

      - name: Check the tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = ($metadata.packages | Where-Object { $_.name -eq 'clone-bay' }).version
          if (-not $version) { throw 'Could not read the clone-bay version from Cargo.' }
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml (expected v$version)."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag $env:GITHUB_REF_NAME points at a commit that is not on main."
          }

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p clone-bay

      - name: Name the exe and write its checksum
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $label = $env:GITHUB_REF_NAME
          } else {
            $label = 'dryrun-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          $asset = "clone-bay-$label-windows-x64.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/clone-bay.exe "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          # The format `sha256sum --check` reads: hash, two spaces, name, LF.
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", "$hash  $asset`n")
          # The licence and the credits go out beside the exe, so they reach
          # people who never see the repository.
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item THIRD-PARTY-NOTICES.txt dist/THIRD-PARTY-NOTICES.txt
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "### Built ``$asset```n`nSHA-256: ``$hash```n`nCommit: ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the exe as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clone-bay-windows-x64
          path: dist/
          if-no-files-found: error

  # Runs none of the project's code: it only signs and publishes what the
  # build job produced.
  publish:
    name: Attest and draft the release
    needs: build
    if: github.ref_type == 'tag' || !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance
      attestations: write # store the provenance
    steps:
      - name: Fetch the built exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clone-bay-windows-x64
          path: dist

      - name: Check the exe against its checksum
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.asset }}

      - name: Create the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ needs.build.outputs.asset }}
          PRIVATE: ${{ github.event.repository.private }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # How to check the download goes above GitHub's generated notes.
          hash=$(cut -d ' ' -f 1 dist/SHA256SUMS.txt)
          {
            echo "## Check this download"
            echo
            echo "Built by GitHub from commit $GITHUB_SHA ([build log]($RUN_URL))."
            echo
            if [ "$PRIVATE" != "true" ]; then
              echo "To prove the exe was built from this code, with the [GitHub CLI](https://cli.github.com):"
              echo
              echo "    gh attestation verify $ASSET --repo $GITHUB_REPOSITORY"
              echo
            fi
            echo "SHA-256 (compare with \`Get-FileHash $ASSET\` in PowerShell):"
            echo
            echo "    $hash"
            echo
            echo "Windows warns the first time you run it, because the exe isn't code signed: choose \"More info\", then \"Run anyway\"."
          } > notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Clone Bay $TAG" \
            --notes-file notes.md \
            --generate-notes \
            "dist/$ASSET" dist/SHA256SUMS.txt dist/LICENSE.txt dist/THIRD-PARTY-NOTICES.txt
