# Mutation testing (cargo-mutants), run before a release.

# The `mutants` build profile (root Cargo.toml) leaves out debug information.
# Measured on 2026-10-12: about 12% quicker on ten mutants of `copy_flow.rs`,
# about 5% on `safe_write.rs`. nextest was tried the same day and not kept:
# it was quicker for the app (5.1 s to 4.1 s a mutant) but slower for core
# (3.1 s to 4.2 s), where most of the mutants are.
profile = "mutants"

# The code that only draws is left out (decided on
# 2026-10-12). It was about 570 of 1,950 mutants, and at the full run before
# v0.1.0 nearly all of its survivors only moved pixels or picked a colour,
# which the UI tests can't see. What those files decide is still covered by
# the test suite; it just isn't mutated. To mutate them anyway, add
# `--no-config --profile mutants -f <file>`.
exclude_globs = [
    "crates/app/build.rs",
    "crates/app/src/main.rs",
    "crates/app/src/app.rs",
    "crates/app/src/viewer.rs",
    "crates/app/src/*_view.rs",
    "crates/app/src/widgets.rs",
    "crates/app/src/theme.rs",
]

# Without the check that the folder exists, the tests would start the real
# file manager on a folder that isn't there.
exclude_re = ["delete ! in show_folder"]

# Known survivors in what is still mutated, checked by hand before the
# first release (2026-10-11):
#
# - crates/core/src/platform.rs: the `process_list` and `file_manager` that
#   are compiled on other systems. On Windows they aren't built, so mutating
#   them does nothing. (5)
# - crates/app/src/services.rs (`SystemClipboard`): the real clipboard,
#   which tests must not touch. (3)
# - crates/app/src/services.rs (`real_updater`, `release_source`),
#   crates/core/src/update_sources.rs (`GitHubReleases`) and
#   crates/core/src/platform.rs (`open_url`, `browser`): the real network,
#   the running exe and the browser, which tests must not touch. The live
#   test (`--ignored update_live`) covers fetching from GitHub. This
#   includes `MAX_TEXT_BYTES` in `update_sources.rs`. (8)
# - crates/core/src/update.rs, `hash_bytes`: `|` and `^` give the same
#   byte, since the two hex digits never share a bit. (1)
# - crates/core/src/install.rs, `clean_leftovers`: the retries and the
#   pause between them. A file that can't be deleted for a moment can't be
#   made in a test without another process holding it open. (6)
# - crates/core/src/install.rs, `run_check`, and crates/core/src/platform.rs,
#   `claim_single_window_waiting`: `<` and `<=` against a deadline differ
#   only at the same instant. (2)
# - crates/core/src/edit.rs, `filter_parts`: the guard on the name. Every
#   caller has already been through `filters`, which refuses the same thing.
# - crates/core/src/edit.rs, `resolve`: the match arm refusing a preset or
#   filter list given the wrong kind of content. `new_value` refuses it too,
#   with the same error.
