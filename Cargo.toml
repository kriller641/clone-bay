[workspace]
resolver = "2"
members = ["crates/marshal", "crates/core", "crates/app"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/kriller641/clone-bay"
publish = false

[workspace.dependencies]
clone-bay-marshal = { path = "crates/marshal" }
clone-bay-core = { path = "crates/core" }
thiserror = "2"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The codec is slow unoptimised; this keeps `cargo run` and tests usable.
[profile.dev.package.clone-bay-marshal]
opt-level = 2

# Used only by mutation testing (`.cargo/mutants.toml`). Leaving out debug
# information makes each mutant quicker to build and link.
[profile.mutants]
inherits = "test"
debug = "none"
