[package]
name = "clone-bay-core"
description = "Finding, reading and safely changing EVE Online settings files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clone-bay-marshal.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tempfile = "3"
# Test-only cross-check. Must never become a runtime dependency.
blue-marshal = "1.0.1"
